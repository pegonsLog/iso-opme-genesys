<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="entrar()">
    <div class="login__brand">
      <span class="login__logo">ISO</span>
      <div>
        <h1 class="login__titulo">OPME · RH</h1>
        <span class="login__sub">Gestão de RH conforme ISO 13485</span>
      </div>
    </div>

    <label class="campo">
      <span class="campo__label">E-mail</span>
      <input class="campo__input" type="email" formControlName="email" autocomplete="username" />
    </label>

    <label class="campo">
      <span class="campo__label">Senha</span>
      <input
        class="campo__input"
        type="password"
        formControlName="senha"
        autocomplete="current-password"
      />
    </label>

    @if (erro()) {
      <div class="login__erro">{{ erro() }}</div>
    }

    <button class="btn btn--primary login__botao" type="submit" [disabled]="carregando()">
      {{ carregando() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</div>
