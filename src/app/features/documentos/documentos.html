<section class="page">
  <app-page-header icon="heroDocumentText" title="Documentos"
    subtitle="Normas regulatórias e documentos controlados pelo RH" />

  <div class="colunas">
    <div class="card painel" style="--i: 0">
      <h2 class="section-title">
        <ng-icon name="heroScale" size="20" />
        Documentos regulatórios
      </h2>
      <p class="field-hint painel-sub">Normas e RDCs aplicáveis</p>
      <ul class="docs">
        @for (d of regulatorios; track d) {
          <li class="docs-item">
            <span class="cell-icon" aria-hidden="true"><ng-icon name="heroBookOpen" size="18" /></span>
            <span class="docs-nome">{{ d }}</span>
          </li>
        }
      </ul>
    </div>

    <div class="card painel" style="--i: 1">
      <h2 class="section-title">
        <ng-icon name="heroFolderOpen" size="20" />
        Documentos controlados pelo RH
      </h2>
      <p class="field-hint painel-sub">Sujeitos a controle de versão</p>
      <ul class="docs">
        @for (d of controlados; track d) {
          <li class="docs-item">
            <span class="cell-icon" aria-hidden="true"><ng-icon name="heroDocumentText" size="18" /></span>
            <span class="docs-nome">{{ d }}</span>
            <span class="badge badge-green">Controle de versão</span>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
