<div class="layout" [class.sidebar-fechada]="!sidebarAberta()">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">ISO</span>
      @if (sidebarAberta()) {
        <span class="sidebar__title">OPME · RH</span>
      }
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="nav-item--active"
          [title]="item.label"
        >
          <span class="nav-item__icon">{{ item.icon }}</span>
          @if (sidebarAberta()) {
            <span class="nav-item__label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      @if (sidebarAberta()) {
        <span>ISO 13485:2016</span>
      }
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="topbar__toggle" type="button" (click)="toggleSidebar()" aria-label="Alternar menu">
        ☰
      </button>
      <h1 class="topbar__heading">Gestão de RH · ISO 13485</h1>
      <div class="topbar__spacer"></div>
      <span class="topbar__badge">Empresa OPME</span>
      @if (mostrarLogout) {
        @if (usuario(); as u) {
          <span class="topbar__usuario">{{ u.email }}</span>
        }
        <button class="topbar__sair" type="button" (click)="sair()" title="Sair">Sair</button>
      }
    </header>

    <main class="main">
      <router-outlet />
    </main>
  </div>
</div>
